plugins {
    id 'maven-publish'
    id 'io.github.gradle-nexus.publish-plugin' version '1.2.0'
    id 'java-library'
    id 'signing'
    id 'jacoco'
}

apply plugin: 'jacoco'
apply from: "./gradle/publish.gradle"

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

group = 'com.github.kuliginstepan'
version = '3.0.0'

repositories {
    mavenCentral()
}

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    testAnnotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.1.0')

    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    api 'io.projectreactor:reactor-core'

    compileOnly 'org.springframework.data:spring-data-mongodb'
    compileOnly 'org.springframework.boot:spring-boot-data-mongodb'
    compileOnly 'org.springframework.boot:spring-boot-actuator-autoconfigure'
    compileOnly 'org.mongodb:mongodb-driver-reactivestreams'
    compileOnly 'org.projectlombok:lombok'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'

    testAnnotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.springframework.boot:spring-boot-transaction'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mongodb'
    testImplementation 'org.mongodb:mongodb-driver-reactivestreams'
    testImplementation 'org.mongodb:mongodb-driver-sync'
    testImplementation 'io.projectreactor:reactor-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}

test {
    useJUnitPlatform()
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = false
    }
}

test.finalizedBy jacocoTestReport
